<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Someone Very Special 💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            padding: 25px;
            width: 85%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .gif-container img {
            width: 180px;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            margin: 10px 0;
        }

        /* Slide Styling */
        .slides-wrapper {
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }

        .slide {
            display: none;
            font-size: 1.3rem;
            color: #ff4d6d;
            font-weight: bold;
            padding: 15px;
            background: #fff0f3;
            border-radius: 15px;
            border: 2px dashed #ff758f;
            width: 100%;
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-in-out;
        }

        .slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Button Styling */
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(255, 77, 109, 0.3);
            transition: 0.2s ease;
        }

        button:hover {
            background-color: #ff2a55;
            transform: scale(1.05);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Balloon Animation */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 70px;
            height: 90px;
            background: #ff4d6d;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
            animation: floatUp 8s linear infinite;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 15px;
            background: #888;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(20deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>For Someone Special 💖</h1>

        <!-- Updated GIF Image Name to p.jpeg -->
        <div class="gif-container">
            <img src="p.jpeg" alt="Bubu Dudu Love">
        </div>

        <!-- Multi-Slide Content -->
        <div class="slides-wrapper">
            <div class="slide active">✨ Aapki khoobsurati</div>
            <div class="slide">😊 Aapki smile</div>
            <div class="slide">💗 Aapka sab kuch, aap bohot pyaari ho!</div>
        </div>

        <!-- Navigation Buttons -->
        <div class="btn-container">
            <button id="prevBtn" onclick="changeSlide(-1)" disabled>Previous</button>
            <button id="nextBtn" onclick="changeSlide(1)">Next 💖</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function changeSlide(direction) {
            slides[currentSlide].classList.remove('active');
            currentSlide += direction;

            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slides.length) currentSlide = slides.length - 1;

            slides[currentSlide].classList.add('active');

            // Button Disable/Enable Logic
            prevBtn.disabled = (currentSlide === 0);
            nextBtn.disabled = (currentSlide === slides.length - 1);
        }

        // Script for Generating Floating I 💗 U Balloons
        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.innerHTML = "I 💗 U";

            balloon.style.left = Math.random() * 90 + "vw";
            const duration = Math.random() * 4 + 6; 
            balloon.style.animationDuration = duration + "s";

            const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#c77dff', '#ffb703'];
            balloon.style.background = colors[Math.floor(Math.random() * colors.length)];

            document.body.appendChild(balloon);

            setTimeout(() => {
                balloon.remove();
            }, duration * 1000);
        }

        setInterval(createBalloon, 800);
    </script>
</body>
</html>
